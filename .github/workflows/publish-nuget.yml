name: Publish NuGet Package

env:
  DOTNET_VERSION: '10.0.x'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate with GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GH_PACKAGES_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            https://nuget.pkg.github.com/ryzespace/index.json

      - name: Set package version from tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/} # e.g. v1.0.1
          PACKAGE_VERSION=${TAG_NAME#v}
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Pack Contracts.Shared
        run: dotnet pack Contracts.Shared/Contracts.Shared.csproj --configuration Release /p:PackageVersion=$PACKAGE_VERSION
    
      - name: Pack MarketplaceIntegration
        run: dotnet pack Contracts.MarketplaceIntegration/Contracts.MarketplaceIntegration.csproj --configuration Release /p:PackageVersion=$PACKAGE_VERSION

      - name: Push to GitHub Packages
        run: dotnet nuget push "**/bin/Release/*.nupkg" --source github --skip-duplicate